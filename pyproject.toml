[project]
name = "photo-cull"
version = "0.2.1"
description = "Automated cross-platform RAW and JPEG culling and evaluation tool"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy<2.0.0",
    "transformers>=4.40.0",
    "pyiqa>=0.1.11",
    "imagehash>=4.3.1",
    "rawpy>=0.21.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.0.0",
    "pandas>=2.2.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
]

# Explicit PyTorch wheel index for NVIDIA CUDA on Windows
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# Direct CUDA wheels to Windows while keeping macOS on standard PyPI MPS wheels
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
]
