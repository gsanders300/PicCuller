[project]
name = "photo-cull"
version = "1.0.1"
description = "Local RAW and JPEG photo culling: group bursts, score every frame, and export the keepers"
readme = "readme.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
keywords = ["photography", "culling", "raw", "burst", "image-quality", "clip", "musiq"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "torch>=2.4,<2.7",
    "torchvision>=0.19,<0.22",
    "numpy>=1.26,<2",
    "transformers>=4.40,<5",
    "pyiqa==0.1.15",
    "imagehash>=4.3,<5",
    "rawpy>=0.21,<0.28",
    "opencv-python>=4.10,<5",
    "pillow>=10,<13",
    "platformdirs>=4,<5",
    "rich>=13.7,<16",
    "requests>=2.31,<3",
]

[project.urls]
Homepage = "https://github.com/gsanders300/PicCuller"
Documentation = "https://github.com/gsanders300/PicCuller/blob/main/docs/reference.md"
Changelog = "https://github.com/gsanders300/PicCuller/releases"

[project.scripts]
photo-cull = "cull:main"
photo-cull-validate = "validation:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[build-system]
# 77 is the first release that accepts a license expression string.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "advanced_analysis",
    "cull",
    "evaluation_cache",
    "file_ops",
    "image_loader",
    "metadata_reader",
    "model_config",
    "model_runtime",
    "portfolio",
    "run_audit",
    "scoring",
    "thumbnail_store",
    "xmp_rating",
    "validation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# An unclosed file only fails on Windows, where it cannot be deleted, so make the
# leak fail on every platform.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001"]

# Explicit PyTorch wheel index for NVIDIA CUDA on Windows
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# Direct CUDA wheels to Windows while keeping macOS on standard PyPI MPS wheels
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
]
