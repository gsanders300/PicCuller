name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run photo-cull --help
